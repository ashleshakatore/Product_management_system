<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .btn {
            padding: 5px 10px;
            text-decoration: none;
            color: white;
            background-color: blue;
            border-radius: 5px;
            margin: 2px;
        }
        .btn-delete {
            background-color: red;
        }
        a{
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>

    <h2>📊 Product Management System</h2>
    <a href="/product" class="btn">➕ Add New Product</a>

    <table>
        <tr>
            <th>Product ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price (₹)</th>
            <th>Quantity</th>
            <th>✏️ Edit</th>
            <th>🗑️ Delete</th>
        </tr>
        <tbody>
            {% for i in products %}
            
            <tr>
                <td>{{i.id}}</td>
                <td>{{i.name}}</td>
                <td>{{i.category}}</td>
                <td>{{i.price}}</td>
                <td>{{i.quantity}}</td>
                <td><a href="/edit/{{i.id}}">Edit</a></td>
                <td><a href="/delete/{{i.id}}">Delete</a></td>
            </tr>
            {% endfor %}
        </tbody>
        
    </table>

</body>
</html>
