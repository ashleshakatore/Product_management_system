<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            width: 100%;
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Product Management</h2>
        <form action="#" method="POST">
            {% csrf_token %}
            <label for="productId">Product ID</label>
            <input type="text" id="employeeId" name="employeeId" value="{{products.id}}">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{products.name}}" >

            <label for="Price">Price</label>
            <input type="number" id="Price" name="price" value="{{products.price}}">

            <label for="Quantity">Quantity</label>
            <input type="number" id="Quantity" name="quantity" value="{{products.quantity}}">

            <label for="Category">Category</label>
            <select id="Category" name="category" value="{{products.category}}">
                <option value="{{products.category}}">{{products.category}}</option>
                <option value="Electronics">Electronics</option>
                <option value="Furniture">Furniture</option>
                <option value="Accessories">Accessories</option>
                <option value="Stationery">Stationery</option>
                <option value="Toys">Toys</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Add</button>
        </form>
    </div>

</body>
</html>
